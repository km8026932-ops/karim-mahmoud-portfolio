  <style>
    :root {
      --bg: #090812;
      --surface: #121022;
      --surface-2: #191630;
      --border: rgba(155, 143, 243, 0.16);
      --border-strong: rgba(155, 143, 243, 0.40);
      --accent: #9B8FF3;
      --accent-soft: #C4BCFF;
      --emerald: #10B981;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }

    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(91, 33, 182, 0.24), transparent),
        radial-gradient(circle at 85% 25%, rgba(155, 143, 243, 0.08), transparent 40%);
    }
    html[dir="rtl"] body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0 !important;
    }

    .bento-card {
      background: linear-gradient(180deg, rgba(25, 22, 48, 0.72) 0%, rgba(18, 16, 34, 0.88) 100%);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .bento-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 18px 40px -15px rgba(155, 143, 243, 0.18);
    }

    .proj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .proj-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 36px -14px rgba(155, 143, 243, 0.25);
    }

    .reel-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }
    .reel-btn:hover {
      border-color: rgba(155, 143, 243, 0.45);
      background: rgba(155, 143, 243, 0.08);
    }
    .reel-btn.active {
      border-color: var(--accent);
      background: linear-gradient(90deg, rgba(155, 143, 243, 0.22) 0%, rgba(155, 143, 243, 0.05) 100%);
    }

    /* Cinema Modal */
    #cinemaModal {
      position: fixed;
      inset: 0;
      background: rgba(6, 5, 12, 0.90);
      backdrop-filter: blur(12px);
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #cinemaModal.open { display: flex; }

    /* Toast */
    #toastBox {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #1B1734;
      color: #FFFFFF;
      border: 1px solid var(--accent);
      padding: 11px 22px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      z-index: 110;
      opacity: 0;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }
    #toastBox.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

    }

    function openCinemaModal({ badge, title, embed, note, imageSrc, clips }) {
      const modal = document.getElementById("cinemaModal");
      const vp = document.getElementById("modalViewport");
      const clipBar = document.getElementById("modalClipBar");

      document.getElementById("modalBadge").textContent = badge || "";
      document.getElementById("modalTitle").textContent = title || "";
      document.getElementById("modalNote").textContent = note || "";

      if (imageSrc && !embed) {
        clipBar.classList.add("hidden");
        clipBar.innerHTML = "";
        vp.innerHTML = `<img src="${imageSrc}" alt="${title || ''}" class="max-h-[66vh] w-auto object-contain rounded-xl p-3" />`;
      } else {
        const loadFrame = (src) => {
          vp.innerHTML = `
            <div class="relative w-full h-[62vh]">
              <iframe src="${src}" title="${title || 'Preview'}" class="w-full h-full border-0" allow="autoplay; fullscreen" allowfullscreen></iframe>
              <div class="absolute top-0 right-0 w-16 h-14 bg-[#07060D] z-10 flex items-center justify-center pointer-events-auto select-none" aria-hidden="true">
                <span class="w-2.5 h-2.5 rounded-full bg-[#9B8FF3]"></span>
              </div>
            </div>`;
        };
        if (clips && clips.length > 1) {
          clipBar.classList.remove("hidden");
          let activeIdx = 0;
          const draw = () => {
            clipBar.innerHTML = clips.map((cl, i) => `
              <button type="button" data-mclip="${i}" class="px-3 py-1 rounded-full text-xs font-bold border transition-colors ${i === activeIdx ? 'bg-[#9B8FF3] border-[#9B8FF3] text-[#090812]' : 'bg-white/5 border-white/15 text-white/80 hover:border-[#9B8FF3]'}">
                ▶ ${state.lang === "ar" ? cl.labelAr : cl.labelEn}
              </button>
            `).join("");
            clipBar.querySelectorAll("[data-mclip]").forEach(b => {
              b.addEventListener("click", () => {
                activeIdx = Number(b.getAttribute("data-mclip"));
                draw();
                loadFrame(clips[activeIdx].embed);
              });
            });
          };
          draw();
          loadFrame(clips[0].embed);
        } else {
          clipBar.classList.add("hidden");
          clipBar.innerHTML = "";
          loadFrame(embed);
        }
      }
      modal.classList.add("open");
    }

    function closeCinemaModal() {
      document.getElementById("cinemaModal").classList.remove("open");
      document.getElementById("modalViewport").innerHTML = "";
    }

    function openProjectById(id) {
      const p = PROJECTS.find(x => x.id === id);
      if (!p) return;
      openCinemaModal({
        badge: p.badge,
        title: state.lang === "ar" ? p.titleAr : p.titleEn,
        embed: p.embed,
        imageSrc: p.imageSrc || null,
        note: state.lang === "ar" ? p.descAr : p.descEn,
        clips: p.clips || null
      });
    }

    function renderProjectCover(p) {
      if (p.coverType === "image") {
        return `<img src="${p.imageSrc}" alt="${p.titleEn}" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-300" />`;
      }
      const headline = (state.lang === "ar" ? p.coverHeadlineAr : p.coverHeadlineEn).replace(/\n/g, "<br>");
      if (p.coverType === "browser") {
        return `
          <div class="w-full h-full p-4 flex flex-col justify-between text-white" style="background:${p.coverBg};">
            <div class="flex items-center justify-between border-b border-white/15 pb-1.5">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#9B8FF3]"></span>
                <span class="w-2 h-2 rounded-full bg-white/30"></span>
                <span class="w-2 h-2 rounded-full bg-white/20"></span>
              </div>
              <span class="text-[10px] font-mono text-white/60" dir="ltr">${p.coverKicker}</span>
            </div>
            <div class="my-auto py-1 text-base font-extrabold leading-snug">${headline}</div>
            <span class="self-start px-2.5 py-0.5 rounded-full bg-white/10 text-[10px] font-bold tracking-wider text-[#C4BCFF]" dir="ltr">${p.coverPill}</span>
          </div>`;
      }
      if (p.coverType === "metric") {
        return `
          <div class="w-full h-full p-4 flex flex-col justify-between text-white" style="background:${p.coverBg};">
            <span class="text-[10px] font-extrabold tracking-widest uppercase text-[#9B8FF3]" dir="ltr">${p.coverKicker}</span>
            <div class="my-auto">
              <div class="font-black text-4xl leading-none" dir="ltr">${p.coverBig}</div>
              <div class="text-xs font-bold text-white/90 mt-1">${headline}</div>
            </div>
            <span class="self-start px-2.5 py-0.5 rounded-full bg-[#9B8FF3]/20 border border-[#9B8FF3]/40 text-[10px] font-bold tracking-wider" dir="ltr">${p.coverPill}</span>
          </div>`;
      }
      return `
        <div class="w-full h-full p-4 flex flex-col justify-between text-white" style="background:${p.coverBg};">
          <span class="text-[10px] font-extrabold tracking-widest uppercase text-[#9B8FF3]" dir="ltr">${p.coverKicker}</span>
          <div class="my-auto text-base sm:text-lg font-extrabold leading-snug">${headline}</div>
          <span class="self-start px-2.5 py-0.5 rounded-full bg-white/10 border border-white/15 text-[10px] font-bold tracking-wider text-white/85" dir="ltr">${p.coverPill}</span>
        </div>`;
    }

    function renderAudience() {
      const c = COPY[state.lang];
      const b1 = document.getElementById("audClientsBtn");
      const b2 = document.getElementById("audLeadersBtn");
      b1.textContent = c.audClients;
      b2.textContent = c.audLeaders;

      const on = "bg-[#9B8FF3] text-[#090812]";
      const off = "text-[#94A3B8] hover:text-white";
      b1.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-colors " + (state.audience === "clients" ? on : off);
      b2.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-colors " + (state.audience === "leaders" ? on : off);

      const items = AUDIENCE_CONTENT[state.audience];
      document.getElementById("audienceCards").innerHTML = items.map(it => `
        <div class="bento-card rounded-2xl p-6">
          <div class="w-11 h-11 rounded-xl bg-[#9B8FF3]/15 border border-[#9B8FF3]/30 flex items-center justify-center text-xl mb-4" aria-hidden="true">${it.icon}</div>
          <h3 class="font-extrabold text-base sm:text-lg text-white mb-2">${state.lang === "ar" ? it.arTitle : it.enTitle}</h3>
          <p class="text-xs sm:text-sm text-[#94A3B8] leading-relaxed">${state.lang === "ar" ? it.arDesc : it.enDesc}</p>
        </div>
      `).join("");
    }

    function renderCinema() {
      const r = REELS[state.reelIndex];
      const frame = document.getElementById("cinemaFrame");
      if (frame.getAttribute("data-src") !== r.embed) {
        frame.src = r.embed;
        frame.setAttribute("data-src", r.embed);
      }

      document.getElementById("reelCounter").textContent = `${String(state.reelIndex + 1).padStart(2, "0")} / ${String(REELS.length).padStart(2, "0")}`;
      document.getElementById("activeReelBrand").textContent = r.brand;
      document.getElementById("activeReelRole").textContent = state.lang === "ar" ? r.roleAr : r.roleEn;
      document.getElementById("activeReelTitle").textContent = state.lang === "ar" ? r.titleAr : r.titleEn;
      document.getElementById("activeReelDesc").textContent = state.lang === "ar" ? r.descAr : r.descEn;
      document.getElementById("expandReelBtn").textContent = COPY[state.lang].expandReel;

      const queue = document.getElementById("reelQueue");
      queue.innerHTML = REELS.map((item, i) => `
        <button type="button" data-q-idx="${i}" class="reel-btn w-full rounded-2xl p-2.5 flex items-center gap-3 text-start ${i === state.reelIndex ? 'active' : ''}">
          <div class="w-14 h-12 rounded-xl shrink-0 flex flex-col items-center justify-center border border-white/15" style="background: linear-gradient(135deg, ${item.accent}44 0%, #090812 100%);">
            <span class="text-[11px] font-black ${i === state.reelIndex ? 'text-[#C4BCFF]' : 'text-white'}">▶</span>
            <span class="text-[9px] font-extrabold tracking-wider text-white/75" dir="ltr">${item.code}</span>
          </div>
          <div class="min-w-0 flex-1">
            <span class="block text-[10px] font-extrabold uppercase tracking-wider text-[#9B8FF3]" dir="ltr">${item.brand}</span>
            <span class="block text-xs font-bold text-white truncate">${state.lang === "ar" ? item.titleAr : item.titleEn}</span>
          </div>
        </button>
      `).join("");

      queue.querySelectorAll("[data-q-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.reelIndex = Number(btn.getAttribute("data-q-idx"));
          renderCinema();
        });
      });
    }

    function renderWork() {
      const c = COPY[state.lang];
      const filters = [
        { id: "all", en: "All", ar: "الكل" },
        { id: "video", en: "Video Ads & Campaigns", ar: "إعلانات وفيديو" },
        { id: "web", en: "Websites & Copy", ar: "مواقع وهوية" },
        { id: "plans", en: "Marketing Plans", ar: "خطط تسويق وسوشيال" },
        { id: "speakers", en: "Speakers & Seasons", ar: "متحدثين ومواسم" }
      ];

      const fWrap = document.getElementById("workFilters");
      fWrap.innerHTML = filters.map(f => {
        const count = f.id === "all" ? PROJECTS.length : PROJECTS.filter(p => p.cat === f.id).length;
        const active = state.workFilter === f.id;
        return `
          <button type="button" data-wf="${f.id}" class="px-4 py-2 rounded-xl text-xs font-extrabold border transition-colors ${active ? 'bg-[#9B8FF3] border-[#9B8FF3] text-[#090812]' : 'bg-[#121022] border-white/10 text-[#94A3B8] hover:border-[#9B8FF3]/50 hover:text-white'}">
            ${state.lang === "ar" ? f.ar : f.en} · ${count}
          </button>`;
      }).join("");

      fWrap.querySelectorAll("[data-wf]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.workFilter = btn.getAttribute("data-wf");
          state.showAllProjects = false;
          renderWork();
        });
      });

      const q = state.search.trim().toLowerCase();
      let filtered = state.workFilter === "all" ? PROJECTS : PROJECTS.filter(p => p.cat === state.workFilter);
      if (q) {
        filtered = filtered.filter(p =>
          p.titleEn.toLowerCase().includes(q) ||
          p.titleAr.toLowerCase().includes(q) ||
          p.descEn.toLowerCase().includes(q) ||
          p.descAr.toLowerCase().includes(q) ||
          p.badge.toLowerCase().includes(q)
        );
      }

      const limit = state.showAllProjects || q ? filtered.length : 9;
      const visible = filtered.slice(0, limit);
      const grid = document.getElementById("workGrid");

      if (!visible.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-[#94A3B8]">${c.emptySearch}</div>`;
      } else {
        grid.innerHTML = visible.map(p => `
          <article class="proj-card rounded-2xl overflow-hidden flex flex-col justify-between group cursor-pointer" data-proj-id="${p.id}">
            <div>
              <div class="relative h-44 overflow-hidden bg-[#07060D] border-b border-white/10">
                ${renderProjectCover(p)}
                <span class="absolute bottom-3 end-3 px-3 py-1 rounded-full bg-[#9B8FF3] text-[#090812] text-[11px] font-extrabold shadow-lg">${c.previewBtn}</span>
              </div>
              <div class="p-5">
                <p class="text-[11px] font-bold text-[#9B8FF3] mb-1">${state.lang === "ar" ? p.roleAr : p.roleEn}</p>
                <h3 class="font-extrabold text-base text-white mb-1.5 leading-snug">${state.lang === "ar" ? p.titleAr : p.titleEn}</h3>
                <p class="text-xs text-[#94A3B8] leading-relaxed">${state.lang === "ar" ? p.descAr : p.descEn}</p>
              </div>
            </div>
          </article>
        `).join("");

        grid.querySelectorAll("[data-proj-id]").forEach(card => {
          card.addEventListener("click", () => openProjectById(card.getAttribute("data-proj-id")));
        });
      }

      const moreWrap = document.getElementById("showMoreWrap");
      const moreBtn = document.getElementById("showMoreBtn");
      if (filtered.length > 9 && !q) {
        moreWrap.classList.remove("hidden");
        moreBtn.textContent = state.showAllProjects ? c.showLess : `${c.showMore} (${filtered.length})`;
      } else {
        moreWrap.classList.add("hidden");
      }
    }

    function renderProcess() {
      const tabs = document.getElementById("stepTabs");
      tabs.innerHTML = PROCESS.map((pr, idx) => `
        <button type="button" data-step-i="${idx}" class="rounded-2xl p-4 text-start border transition-all ${idx === state.stepIndex ? 'bg-[#9B8FF3] border-[#9B8FF3] text-[#090812]' : 'bg-[#121022] border-white/10 text-white hover:border-[#9B8FF3]/50'}">
          <span class="block text-xs font-black ${idx === state.stepIndex ? 'text-[#090812]/70' : 'text-[#9B8FF3]'}" dir="ltr">${pr.num}</span>
          <span class="block font-extrabold text-sm mt-0.5">${state.lang === "ar" ? pr.ar : pr.en}</span>
        </button>
      `).join("");

      tabs.querySelectorAll("[data-step-i]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.stepIndex = Number(btn.getAttribute("data-step-i"));
          renderProcess();
        });
      });

      const active = PROCESS[state.stepIndex];
      document.getElementById("stepDetailCard").innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="max-w-2xl">
            <span class="inline-block px-3 py-1 rounded-full bg-[#9B8FF3]/15 border border-[#9B8FF3]/35 text-[#C4BCFF] text-xs font-extrabold mb-3" dir="ltr">STEP ${active.num} / 05</span>
            <h3 class="font-black text-2xl text-white mb-2">${state.lang === "ar" ? active.ar : active.en}</h3>
            <p class="text-sm sm:text-base text-[#94A3B8] leading-relaxed">${state.lang === "ar" ? active.descAr : active.descEn}</p>
          </div>
          <div class="shrink-0 rounded-2xl bg-[#10B981]/10 border border-[#10B981]/30 px-4 py-3 text-xs font-extrabold text-[#34D399]">
            ${state.lang === "ar" ? active.kpiAr : active.kpiEn}
          </div>
        </div>
      `;
    }

    function renderAll() {
      const c = COPY[state.lang];
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";

      document.getElementById("navSubRole").textContent = c.navSubRole;
      document.getElementById("navValue").textContent = c.navValue;
      document.getElementById("navShowreel").textContent = c.navShowreel;
      document.getElementById("navWork").textContent = c.navWork;
      document.getElementById("navProcess").textContent = c.navProcess;
      document.getElementById("navExp").textContent = c.navExp;
      document.getElementById("navWaBtn").textContent = c.navWa;
      document.getElementById("langToggle").textContent = c.langBtn;

      document.getElementById("heroBadge").textContent = c.heroBadge;
      document.getElementById("heroHeadline").textContent = c.heroHeadline;
      document.getElementById("heroSub").textContent = c.heroSub;
      document.getElementById("heroPrimaryCta").textContent = c.heroPrimaryCta;
      document.getElementById("heroWaCta").textContent = c.heroWaCta;
      document.getElementById("heroArchiveCta").textContent = c.heroArchiveCta;
      document.getElementById("heroCardCaption").textContent = c.heroCardCaption;
      document.getElementById("focusLabel1").textContent = c.focusLabel1;
      document.getElementById("focusVal1").textContent = c.focusVal1;
      document.getElementById("focusLabel2").textContent = c.focusLabel2;
      document.getElementById("focusVal2").textContent = c.focusVal2;

      document.getElementById("heroStats").innerHTML = HERO_STATS.map(st => `
        <div class="rounded-xl bg-white/[0.03] border border-white/10 p-3">
          <span class="block font-black text-xl sm:text-2xl text-[#9B8FF3]" dir="ltr">${st.num}</span>
          <span class="block text-[11px] font-bold text-[#94A3B8] mt-0.5">${state.lang === "ar" ? st.ar : st.en}</span>
        </div>
      `).join("");

      document.getElementById("valEyebrow").textContent = c.valEyebrow;
      document.getElementById("valTitle").textContent = c.valTitle;
      renderAudience();

      document.getElementById("reelEyebrow").textContent = c.reelEyebrow;
      document.getElementById("reelTitle").textContent = c.reelTitle;
      document.getElementById("playlistHeading").textContent = c.playlistHeading;
      renderCinema();

      document.getElementById("workEyebrow").textContent = c.workEyebrow;
      document.getElementById("workTitle").textContent = c.workTitle;
      document.getElementById("workSearch").placeholder = c.searchPlaceholder;
      renderWork();

      document.getElementById("procEyebrow").textContent = c.procEyebrow;
      document.getElementById("procTitle").textContent = c.procTitle;
      renderProcess();

      document.getElementById("expEyebrow").textContent = c.expEyebrow;
      document.getElementById("expTitle").textContent = c.expTitle;
      document.getElementById("expList").innerHTML = EXPERIENCE.map(e => `
        <div class="flex items-start justify-between gap-3 border-b border-white/10 pb-3.5 last:border-b-0 last:pb-0">
          <div>
            <h3 class="font-bold text-sm sm:text-base text-white">${state.lang === "ar" ? e.titleAr : e.titleEn}</h3>
            <p class="text-xs text-[#94A3B8]">${state.lang === "ar" ? e.orgAr : e.orgEn}</p>
          </div>
          <span class="px-2.5 py-1 rounded-lg bg-[#9B8FF3]/10 text-[#C4BCFF] text-[11px] font-extrabold shrink-0" dir="ltr">${e.yr}</span>
        </div>
      `).join("");

      document.getElementById("clientsEyebrow").textContent = c.clientsEyebrow;
      document.getElementById("clientsTitle").textContent = c.clientsTitle;
      const clWrap = document.getElementById("clientsWrap");
      clWrap.innerHTML = CLIENTS.map(cl => `
        <button type="button" data-cl-id="${cl.id}" class="px-3 py-1.5 rounded-xl bg-white/[0.04] border border-white/10 hover:border-[#9B8FF3] hover:text-[#C4BCFF] text-xs font-bold text-white transition-colors">
          ${cl.name} ▶
        </button>
      `).join("");
      clWrap.querySelectorAll("[data-cl-id]").forEach(btn => {
        btn.addEventListener("click", () => openProjectById(btn.getAttribute("data-cl-id")));
      });

      document.getElementById("galleryEyebrow").textContent = c.galleryEyebrow;
      document.getElementById("galleryTitle").textContent = c.galleryTitle;
      const gWrap = document.getElementById("studioGallery");
      gWrap.innerHTML = GALLERY.map((ph, idx) => `
        <button type="button" data-gidx="${idx}" class="group relative aspect-square rounded-xl overflow-hidden border border-white/10 hover:border-[#9B8FF3] transition-colors bg-[#090812]">
          <img src="${ph.img}" alt="${ph.en}" class="w-full h-full object-cover object-top transition-transform duration-300 group-hover:scale-105" />
        </button>
      `).join("");
      gWrap.querySelectorAll("[data-gidx]").forEach(btn => {
        btn.addEventListener("click", () => {
          const ph = GALLERY[Number(btn.getAttribute("data-gidx"))];
          openCinemaModal({
            badge: "KARIM MAHMOUD • STUDIO",
            title: state.lang === "ar" ? ph.ar : ph.en,
            imageSrc: ph.img,
            note: state.lang === "ar" ? "لقطة من جلسات التصوير والبودكاست والإخراج الإبداعي." : "Creative direction, podcast, and studio portrait showcase."
          });
        });
      });

      document.getElementById("ctaEyebrow").textContent = c.ctaEyebrow;
      document.getElementById("ctaTitle").textContent = c.ctaTitle;
      document.getElementById("ctaSub").textContent = c.ctaSub;
      document.getElementById("ctaWaBtn").textContent = c.ctaWaBtn;
    }

    // Wire all controls
    document.getElementById("langToggle").addEventListener("click", () => {
      state.lang = state.lang === "ar" ? "en" : "ar";
      renderAll();
    });
    document.getElementById("audClientsBtn").addEventListener("click", () => {
      state.audience = "clients";
      renderAudience();
    });
    document.getElementById("audLeadersBtn").addEventListener("click", () => {
      state.audience = "leaders";
      renderAudience();
    });
    document.getElementById("prevReelBtn").addEventListener("click", () => {
      state.reelIndex = (state.reelIndex - 1 + REELS.length) % REELS.length;
      renderCinema();
    });
    document.getElementById("nextReelBtn").addEventListener("click", () => {
      state.reelIndex = (state.reelIndex + 1) % REELS.length;
      renderCinema();
    });
    document.getElementById("expandReelBtn").addEventListener("click", () => {
      const r = REELS[state.reelIndex];
      openCinemaModal({
        badge: r.brand,
        title: state.lang === "ar" ? r.titleAr : r.titleEn,
        embed: r.embed,
        note: state.lang === "ar" ? r.descAr : r.descEn
      });
    });
    document.getElementById("workSearch").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderWork();
    });
    document.getElementById("showMoreBtn").addEventListener("click", () => {
      state.showAllProjects = !state.showAllProjects;
      renderWork();
    });
    document.getElementById("heroPhotoBtn").addEventListener("click", () => {
      openCinemaModal({
        badge: "KARIM MAHMOUD",
        title: state.lang === "ar" ? "مدير تسويق رقمي واستراتيجي إبداعي" : "Digital Marketing Manager & Creative Strategist",
        imageSrc: IMAGES.suit,
        note: "Egypt & Saudi Arabia • km8026932@gmail.com"
      });
    });
    document.getElementById("closeModalBtn").addEventListener("click", closeCinemaModal);
    document.getElementById("cinemaModal").addEventListener("click", (e) => {
      if (e.target.id === "cinemaModal") closeCinemaModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeCinemaModal();
    });
    document.getElementById("copyEmailBtn").addEventListener("click", () => {
      const email = "km8026932@gmail.com";
      const done = () => showToast(COPY[state.lang].copiedEmail);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(done).catch(() => {
          const ta = document.createElement("textarea");
          ta.value = email;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = email;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      }
    });

    renderAll();
  </script>
</body>
